<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta http-equiv="X-UA-Compatible" content="ie=edge">
      <title>PhasorFLIM</title>
</head>

<body>
      <div>
            <h1>Phasor FLIM</h1>
      </div>
      <div id="intro">
            <p>
                  Phasor transformation of PicoQuant .ptu TTTR data. Final goal: FRET-FLIM analysis in the phasor space
                  guided by theoretical FRET trajectories.
            </p>
      </div>

      <div id="controls">
            <button id="ptuSubmit">Choose File</button>
            <p>
                  Select Channel: <input id="channelSelector" value="0" type="number" min="0" max="3"> </br>
                  <button id="processPtu">Show Intensity Image</button> </br>
                  Multiply Intensity with: <input id="intensityMultiplicator" type="number" value="1" min="1" max="255">
            </p>

      </div>

      </br>

      <div id="phasor">
            <button id="makePhasor">Calculate Phasor Transform</button>
      </div>

      </br>

      <canvas id="outputImg" style="background-color:black" width="256" height="256"></canvas>
</body>
<script src=" ./renderer.js"> </script>

</html>
